<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Semana 05 - Assincronismo e APIs</title>
</head>
<body>
    <h2>Buscador de CEP</h2>
    <form id="form-cep">
        <input type="text" id="input-cep" placeholder="Digite apenas os 8 números">
        <button type="submit" id="btn-cep">Buscar</button>
    </form>
    <p id="status-cep"></p>
    <dl id="resultado-cep"></dl>
    
    <h3>Histórico de CEPs pesquisados</h3>
    <ul id="historico-cep"></ul>

    <hr>

    <h2>Mini Pokédex</h2>
    <form id="form-poke">
        <input type="text" id="input-poke" placeholder="Nome do Pokémon">
        <button type="submit" id="btn-poke">Buscar</button>
    </form>
    <p id="status-poke"></p>
    <div id="resultado-poke"></div>

    <script src="app.js"></script>
</body>
</html>
